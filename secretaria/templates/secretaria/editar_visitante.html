{% extends 'base_com_menu.html' %}
{% block content %}

<div class="container mt-4">
  <h2>{{ titulo_pagina }}</h2>
  <form method="post" class="card p-4 shadow-sm">
    {% csrf_token %}
  {{ form.as_p }}
  <small class="text-muted">Status de acompanhamento: Novo, Em Acompanhamento, Interessado, Não Retornou, Encerrado</small>
    <button type="submit" class="btn btn-primary">Salvar Alterações</button>
    <a href="{% url 'secretaria:lista_visitantes' %}" class="btn btn-secondary ms-2">Cancelar</a>
  </form>
</div>
{% endblock %}
