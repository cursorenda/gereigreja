{% extends 'base_com_menu.html' %}
{% block title %}Remover Colaborador EBD{% endblock %}
{% block content %}
<div class="container-fluid px-4">
    <h1 class="mt-4">Remover Colaborador</h1>
    <div class="alert alert-warning">
        Tem certeza que deseja remover o vínculo de <b>{{ vinculo.membro.nome }}</b> com o cargo <b>{{ vinculo.cargo.nome }}</b>?
    </div>
    <form method="post">{% csrf_token %}
        <button type="submit" class="btn btn-danger">Remover</button>
        <a href="{% url 'secretaria:equipe_ebd_list' %}" class="btn btn-secondary ms-2">Cancelar</a>
    </form>
</div>
{% endblock %}
