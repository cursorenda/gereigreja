{% extends 'base_com_menu.html' %}
{% block content %}
<div class="container-fluid px-4">
    <h1 class="mt-4">Novo Cargo</h1>
    <ol class="breadcrumb mb-4">
        <li class="breadcrumb-item"><a href="{% url 'secretaria:index' %}">Home</a></li>
        <li class="breadcrumb-item"><a href="{% url 'secretaria:lista_cargos' %}">Cargos</a></li>
        <li class="breadcrumb-item active">Novo Cargo</li>
    </ol>
    
    <div class="card mb-4">
        <div class="card-header">
            <i class="fas fa-briefcase me-1"></i>
            Novo Cargo
        </div>
        <div class="card-body">
            <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div class="mb-3">
        <label for="id_nome" class="form-label">Nome do Cargo</label>
        {{ form.nome }}
        {{ form.nome.errors }}
    </div>
    <div class="mb-3">
        <label for="id_grupo_permissao" class="form-label">Grupo de Permissão (opcional)</label>
    {{ form.grupo_permissao }}
        {{ form.grupo_permissao.errors }}
    </div>
    <button type="submit" class="btn btn-vibrant-green">Salvar</button>
    <a href="{% url 'secretaria:lista_cargos' %}" class="btn btn-cancel">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
