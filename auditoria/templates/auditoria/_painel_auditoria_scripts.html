<script>
(function() {
    const diasInput = document.getElementById('dias');
    const dias = diasInput ? diasInput.value : '30';
    const endpoint = "{% url 'auditoria:api_estatisticas' %}?dias=" + encodeURIComponent(dias);

    function parseDistribuicao(data) {
        const labels = [];
        const values = [];
        (data || []).forEach(function(item) {
            labels.push(item.acao || '-');
            values.push(item.total || 0);
        });
        return { labels, values };
    }

    fetch(endpoint, { credentials: 'same-origin' })
        .then(function(resp) {
            if (!resp.ok) {
                throw new Error('Falha ao carregar estatisticas');
            }
            return resp.json();
        })
        .then(function(payload) {
            const serieLabels = payload.serie_alteracoes.map(function(p) { return p.data; });
            const serieAlteracoes = payload.serie_alteracoes.map(function(p) { return p.total; });
            const serieNegados = payload.serie_acessos_negados.map(function(p) { return p.total; });

            const ctxSerie = document.getElementById('graficoSerieAuditoria');
            if (ctxSerie) {
                new Chart(ctxSerie, {
                    type: 'line',
                    data: {
                        labels: serieLabels,
                        datasets: [
                            {
                                label: 'Alteracoes',
                                data: serieAlteracoes,
                                borderColor: '#0d6efd',
                                backgroundColor: 'rgba(13, 110, 253, 0.15)',
                                tension: 0.25,
                                fill: true,
                            },
                            {
                                label: 'Acessos Negados',
                                data: serieNegados,
                                borderColor: '#dc3545',
                                backgroundColor: 'rgba(220, 53, 69, 0.1)',
                                tension: 0.25,
                                fill: true,
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: { precision: 0 }
                            }
                        }
                    }
                });
            }

            const distribuicao = parseDistribuicao(payload.distribuicao_acoes);
            const ctxDistribuicao = document.getElementById('graficoDistribuicaoAcoes');
            if (ctxDistribuicao) {
                new Chart(ctxDistribuicao, {
                    type: 'bar',
                    data: {
                        labels: distribuicao.labels,
                        datasets: [
                            {
                                label: 'Total',
                                data: distribuicao.values,
                                backgroundColor: ['#0d6efd', '#198754', '#fd7e14', '#6f42c1', '#20c997'],
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: { precision: 0 }
                            }
                        }
                    }
                });
            }

            const listaDistribuicao = document.getElementById('listaDistribuicaoAcoes');
            if (listaDistribuicao && distribuicao.labels.length > 0) {
                listaDistribuicao.innerHTML = distribuicao.labels.map(function(label, idx) {
                    return '<li>' + label + ': ' + distribuicao.values[idx] + '</li>';
                }).join('');
            }
        })
        .catch(function() {
            const listaDistribuicao = document.getElementById('listaDistribuicaoAcoes');
            if (listaDistribuicao) {
                listaDistribuicao.innerHTML = '<li>Falha ao carregar dados de graficos.</li>';
            }
        });
})();
</script>
