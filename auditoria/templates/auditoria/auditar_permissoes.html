{% extends "admin/base_site.html" %}
{% block content %}
  <h1>Auditoria de Permissões</h1>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="default">Executar Auditoria</button>
  </form>
  {% if resultado %}
    <h2>Resultado:</h2>
    <pre>{{ resultado }}</pre>
  {% endif %}
{% endblock %}
