---
deployment:
  tasks:
    # Define o caminho do projeto. O cPanel já faz o checkout aqui.
    - export DEPLOYPATH=/home/gerei1/gereigreja.site/
    # Ativa o ambiente virtual e instala as dependências.
    - /home/gerei1/virtualenv/gereigreja.site/3.11/bin/pip install -r $DEPLOYPATH/requirements.txt
    # Executa as migrações do banco de dados.
    # Coleta os arquivos estáticos para produção.
    - /home/gerei1/virtualenv/gereigreja.site/3.11/bin/python $DEPLOYPATH/manage.py collectstatic --noinput
    # AVISO: O comando migrate foi desabilitado temporariamente. Execute-o manualmente no terminal após o deploy.
    # - /home/gerei1/virtualenv/gereigreja.site/3.11/bin/python $DEPLOYPATH/manage.py migrate --noinput
    # Cria o arquivo restart.txt para reiniciar a aplicação Phusion Passenger.
    - /bin/mkdir -p $DEPLOYPATH/tmp
    - /bin/touch $DEPLOYPATH/tmp/restart.txt
