{% extends 'base_com_menu.html' %}
{% block content %}
<div class="container mt-4">
  <h2>Excluir Oferta</h2>
  <p>Tem certeza que deseja excluir a oferta da <strong>{{ oferta.classe }}</strong> em <strong>{{ oferta.data|date:'d/m/Y' }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sim, excluir</button>
    <a href="{% url 'escola_biblica:oferta_classe_list' %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
