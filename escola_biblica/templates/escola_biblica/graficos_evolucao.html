{% extends 'base_com_menu.html' %}
{% block title %}Evolução por Classe{% endblock %}
{% block content %}
<div class="container mt-4">
  <h2>Evolução de Alunos e Ofertas por Classe (12 meses)</h2>
  <div class="row">
    <div class="col-md-12 mb-4">
      <div class="card">
        <div class="card-header">Evolução de Alunos por Classe</div>
        <div class="card-body">
          <canvas id="evolucaoAlunos"></canvas>
        </div>
      </div>
    </div>
    <div class="col-md-12 mb-4">
      <div class="card">
        <div class="card-header">Evolução de Ofertas por Classe</div>
        <div class="card-body">
          <canvas id="evolucaoOfertas"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="application/json" id="meses-json">{{ meses|safe }}</script>
<script type="application/json" id="alunos-evolucao-json">{{ alunos_evolucao|safe }}</script>
<script type="application/json" id="ofertas-evolucao-json">{{ ofertas_evolucao|safe }}</script>
<script>
  const meses = JSON.parse(document.getElementById('meses-json').textContent);
  const alunosEvolucao = JSON.parse(document.getElementById('alunos-evolucao-json').textContent);
  const ofertasEvolucao = JSON.parse(document.getElementById('ofertas-evolucao-json').textContent);

  // Gráfico de evolução de alunos
  const ctxAlunos = document.getElementById('evolucaoAlunos').getContext('2d');
  new Chart(ctxAlunos, {
    type: 'line',
    data: {
      labels: meses,
      datasets: Object.keys(alunosEvolucao).map((classe, idx) => ({
        label: classe,
        data: alunosEvolucao[classe],
        borderColor: `hsl(${idx*60},70%,50%)`,
        fill: false
      }))
    },
    options: {
      responsive: true,
      plugins: { legend: { position: 'top' } },
      scales: { y: { beginAtZero: true } }
    }
  });

  // Gráfico de evolução de ofertas
  const ctxOfertas = document.getElementById('evolucaoOfertas').getContext('2d');
  new Chart(ctxOfertas, {
    type: 'line',
    data: {
      labels: meses,
      datasets: Object.keys(ofertasEvolucao).map((classe, idx) => ({
        label: classe,
        data: ofertasEvolucao[classe],
        borderColor: `hsl(${idx*60+180},70%,50%)`,
        fill: false
      }))
    },
    options: {
      responsive: true,
      plugins: { legend: { position: 'top' } },
      scales: { y: { beginAtZero: true } }
    }
  });
</script>
{% endblock %}
