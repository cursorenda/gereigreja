{% extends 'base_com_menu.html' %}
{% block content %}
<div class="container mt-4">
  <h2>Chamada de Presença - {{ turma }}</h2>
  <form method="post">
    {% csrf_token %}
    <div class="row mb-3">
      <div class="col-md-4">
        <label for="data" class="form-label">Data da Chamada</label>
        <input type="date" name="data" id="data" class="form-control" value="{{ data }}" readonly>
      </div>
    </div>
    <table class="table table-bordered table-striped">
      <thead>
        <tr>
          <th>Aluno</th>
          <th>Presente?</th>
        </tr>
      </thead>
      <tbody>
        {% for form in formset %}
        <tr>
          <td>{{ form.nome.value }}</td>
          <td>{{ form.presente }}</td>
          {{ form.aluno_id }}
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <button type="submit" class="btn btn-success">Salvar Chamada</button>
    <a href="{% url 'escola_biblica:turma_list' %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
