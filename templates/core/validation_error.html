{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="alert alert-danger">
        <h4 class="alert-heading">Erro de Validação</h4>
        <p>{{ mensagem }}</p>
        {% if erros %}
            <ul>
            {% for erro in erros %}
                <li>{{ erro }}</li>
            {% endfor %}
            </ul>
        {% endif %}
        <hr>
        <a href="javascript:history.back()" class="btn btn-primary">Voltar</a>
    </div>
</div>
{% endblock %}
