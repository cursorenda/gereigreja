{# Badge de escopo ativo (usa scope_label ou request.igreja_ativa). #}
{% if scope_label %}
<div class="d-flex align-items-center py-2 px-3 mb-3 rounded border-start border-4 border-primary"
     style="background: rgba(13,130,129,0.08);">
  <i class="fas fa-filter me-2 text-primary" style="font-size:0.9rem;"></i>
  <small class="text-muted"><strong class="text-primary">Escopo:</strong> {{ scope_label }}</small>
</div>
{% elif request.igreja_ativa %}
<div class="d-flex align-items-center py-2 px-3 mb-3 rounded border-start border-4 border-primary"
     style="background: rgba(13,130,129,0.08);">
  <i class="fas fa-church me-2 text-primary" style="font-size:0.9rem;"></i>
  <small class="text-muted"><strong class="text-primary">Igreja:</strong> {{ request.igreja_ativa.nome_igreja }}</small>
</div>
{% endif %}
