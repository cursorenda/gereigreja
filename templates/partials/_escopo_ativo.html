{# Badge de escopo ativo (usa scope_label ou request.igreja_ativa). #}
{% if scope_label %}
<div class="d-flex align-items-center py-2 px-3 mb-3 rounded border-start border-4 border-info"
     style="background: rgba(13,202,240,0.07);">
  <i class="fas fa-filter me-2 text-info" style="font-size:0.9rem;"></i>
  <small class="text-muted"><strong class="text-info">Escopo:</strong> {{ scope_label }}</small>
</div>
{% elif request.igreja_ativa %}
<div class="d-flex align-items-center py-2 px-3 mb-3 rounded border-start border-4 border-info"
     style="background: rgba(13,202,240,0.07);">
  <i class="fas fa-church me-2 text-info" style="font-size:0.9rem;"></i>
  <small class="text-muted"><strong class="text-info">Igreja:</strong> {{ request.igreja_ativa.nome_igreja }}</small>
</div>
{% endif %}
