{% extends 'base_publico.html' %}
{% block title %}Recuperar Senha - Gereigreja{% endblock %}
{% block content %}
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card shadow-lg border-0 rounded-lg mt-5">
                    <div class="card-header">
                        <h3 class="text-center font-weight-light my-4">Recuperar Senha</h3>
                    </div>
                    <div class="card-body">
                        <div class="small mb-3 text-muted">Digite seu endereço de e-mail e enviaremos um link para redefinir sua senha.</div>
                        <form method="post" action="{% url 'password_reset' %}">
                            {% csrf_token %}
                            <div class="form-floating mb-3">
                                <input class="form-control" id="inputEmail" type="email" name="email" placeholder="nome@exemplo.com" required />
                                <label for="inputEmail">Endereço de Email</label>
                            </div>
                            <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                                <a class="small" href="{% url 'login' %}">Retornar para Login</a>
                                <button type="submit" class="btn btn-primary">Redefinir Senha</button>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer text-center py-3">
                        <div class="small"><a href="{% url 'register' %}">Precisa de uma conta? Registrar-se!</a></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
