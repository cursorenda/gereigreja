{% extends 'base.html' %}
{% block title %}Senha Redefinida{% endblock %}

{% block content %}
<style>
.auth-card .card-header { background: linear-gradient(135deg, #0d8281 0%, #0a6665 100%); color: #fff; border-bottom: 0; }
.auth-card .card-header h3 { color: #fff !important; }
.auth-card .btn-primary { background-color: #0d8281; border-color: #0d8281; }
.auth-card .btn-primary:hover { background-color: #0a6665; border-color: #0a6665; }
</style>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-lg border-0 rounded-lg mt-5 auth-card">
                <div class="card-header"><h3 class="text-center font-weight-light my-4">Senha Redefinida com Sucesso</h3></div>
                <div class="card-body">
                    <p class="text-center">Sua senha foi definida com sucesso. Você já pode fazer login com sua nova senha.</p>
                    <div class="text-center mt-4">
                        <a href="{% url 'login' %}" class="btn btn-primary">Fazer Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
