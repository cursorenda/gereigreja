{% extends 'base_com_menu.html' %}
{% load static %}
{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-8">
            <h2 class="mt-4 mb-4">Cadastrar Despesa</h2>
            <div class="card mb-4">
                <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="form-group">
                        {% for field in form.visible_fields %}
                        <div class="form-group">
                            {{ field.label_tag }}
                            {{ field }}
                        </div>
                         {% endfor %}
                        <button type="submit" class="btn btn-primary">Cadastrar</button>
                    </div>
                </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <script>
        $(document).ready(function(){
            $('#id_valor').mask('000.000.000,00', {reverse: true});
        });
    </script>
{% endblock %}
