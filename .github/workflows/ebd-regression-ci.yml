name: EBD Regression CI

on:
  push:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/ebd-regression-ci.yml'
      - 'escola_biblica/**'
      - 'core/settings_test.py'
      - 'requirements.txt'
  pull_request:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/ebd-regression-ci.yml'
      - 'escola_biblica/**'
      - 'core/settings_test.py'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  ebd-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DJANGO_SETTINGS_MODULE: core.settings_test
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-ebd-secret-key
      CLOUDINARY_CLOUD_NAME: ci
      CLOUDINARY_API_KEY: ci
      CLOUDINARY_API_SECRET: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure Logs Directory
        run: mkdir -p logs

      - name: Run EBD Focused Regression Tests
        run: |
          python manage.py test \
            escola_biblica.tests.test_pontos_ebd \
            escola_biblica.tests.test_chamada_fluxo \
            --settings=core.settings_test -v 2
